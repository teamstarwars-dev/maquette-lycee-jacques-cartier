name: Actualités auto

# Récupère les dernières actus du vrai site chaque lundi à 7h (UTC),
# régénère le site et republie sur GitHub Pages.
# Déclenchable aussi manuellement (onglet Actions > Actualités auto > Run workflow).

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Récupérer les actualités
        run: node fetch-news.js

      - name: Régénérer le site
        run: node generate.js

      - name: Commit sur master si changements
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json images/news-fiche-* index.html
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Aucune nouveauté, rien à publier."
          else
            git commit -m "Mise à jour auto des actualités"
            git push origin HEAD:master
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Republier sur GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        run: git push origin HEAD:gh-pages --force
